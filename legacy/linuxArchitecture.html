<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquitectura Linux - dev_null</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-main: #c9d1d9;
            --accent-green: #2ea043;
            --accent-hover: #3fb950;
            --panel-bg: #161b22;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: var(--accent-green);
            margin-bottom: 5px;
        }

        .subtitle {
            margin-bottom: 40px;
            color: #8b949e;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 40px;
            max-width: 1000px;
            width: 100%;
        }

        .diagram {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex: 1;
        }

        .layer {
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .layer:hover {
            border-color: var(--accent-hover);
            color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(46, 160, 67, 0.2);
        }

        .layer.active {
            border-color: var(--accent-green);
            background-color: rgba(46, 160, 67, 0.1);
            color: var(--accent-green);
        }

        .info-panel {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .info-panel h2 {
            color: var(--accent-green);
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .info-label {
            color: #8b949e;
            font-weight: bold;
            margin-top: 15px;
        }

        .info-content {
            margin-top: 5px;
            line-height: 1.5;
        }

        .prompt {
            color: var(--accent-green);
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <h1><span class="prompt">~/dev_null$</span> ./arquitectura_linux.sh</h1>
    <div class="subtitle">Desarmando el sistema operativo - Haz clic en cada capa</div>

    <div class="container">
        <div class="diagram">
            <div class="layer" onclick="showInfo(3, this)">4. Espacio de Usuario / Aplicaciones</div>
            <div class="layer" onclick="showInfo(2, this)">3. Shell</div>
            <div class="layer" onclick="showInfo(1, this)">2. Kernel</div>
            <div class="layer" onclick="showInfo(0, this)">1. Hardware</div>
        </div>

        <div class="info-panel" id="infoPanel">
            <h2 id="layerTitle">Selecciona una capa</h2>
            <div class="info-label">Analogía del Restaurante:</div>
            <div class="info-content" id="layerAnalogy">Esperando input del usuario...</div>

            <div class="info-label">Ejemplos Reales:</div>
            <div class="info-content" id="layerExamples">...</div>

            <div class="info-label">Función Técnica:</div>
            <div class="info-content" id="layerFunction">...</div>
        </div>
    </div>

    <script>
        const layersData = [
            {
                title: "1. Hardware",
                analogy: "La Cocina. Los componentes físicos y brutos donde ocurre el trabajo pesado.",
                examples: "Procesador (CPU), Memoria RAM, Discos Duros / SSD, Tarjetas de Red.",
                function: "Proveer los recursos físicos fundamentales para ejecutar procesos y almacenar datos a nivel de transistores y pulsos eléctricos."
            },
            {
                title: "2. Kernel",
                analogy: "El Chef Ejecutivo. Organiza todo, pero nadie habla con él directamente. Evita que la cocina se queme.",
                examples: "Gestor de memoria, planificador de procesos (Scheduler), drivers de dispositivos.",
                function: "Es el núcleo de Linux. Gestiona de manera segura y eficiente la comunicación entre el hardware físico y los procesos de software."
            },
            {
                title: "3. Shell",
                analogy: "El Mesero. Tú (el cliente) le das tu orden, y él se la traduce y entrega al Chef (Kernel).",
                examples: "Bash, Zsh, Sh, Fish.",
                function: "Actúa como un intérprete de comandos. Recibe instrucciones del usuario mediante texto en la terminal y ejecuta las llamadas al sistema operativo correspondientes."
            },
            {
                title: "4. Espacio de Usuario",
                analogy: "Los Clientes. Los que ocupan las mesas y piden cosas a la cocina para funcionar.",
                examples: "Nginx, scripts de PHP, Docker, Git, Navegadores Web.",
                function: "El entorno donde se ejecutan todas las aplicaciones normales. Tiene acceso restringido a la memoria y no puede manipular el hardware directamente por razones de seguridad."
            }
        ];

        function showInfo(index, element) {
            // Actualizar datos
            document.getElementById('layerTitle').innerText = layersData[index].title;
            document.getElementById('layerAnalogy').innerText = layersData[index].analogy;
            document.getElementById('layerExamples').innerText = layersData[index].examples;
            document.getElementById('layerFunction').innerText = layersData[index].function;

            // Manejar clases activas
            const layers = document.querySelectorAll('.layer');
            layers.forEach(layer => layer.classList.remove('active'));
            element.classList.add('active');
        }
    </script>

</body>

</html>
